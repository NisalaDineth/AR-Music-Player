<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    #start-ar {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 10;
      padding: 15px 20px;
      font-size: 18px;
    }
  </style>
</head>

<body>

  <button id="start-ar">START AR</button>

  <script>
    const button = document.getElementById('start-ar');

    button.addEventListener('click', async () => {

      try {

        const session = await navigator.xr.requestSession(
          'immersive-ar',
          {
            requiredFeatures: ['hit-test']
          }
        );

        alert('1. AR session started');

        session.addEventListener('end', () => {
          alert('AR session ended');
        });

        const viewerSpace =
          await session.requestReferenceSpace('viewer');

        alert('2. Viewer space created');

        const hitTestSource =
          await session.requestHitTestSource({
            space: viewerSpace
          });

        alert('3. Hit-test source created');

      } catch (error) {

        alert('ERROR: ' + error.message);
        console.error(error);

      }

    });
  </script>

</body>
</html>
