<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <script src="https://aframe.io/releases/1.4.1/aframe.min.js"></script>

  <style>
    body {
      margin: 0;
    }

    #place-button {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;

      padding: 15px 25px;
      font-size: 18px;
    }
  </style>
</head>

<body>

  <button id="place-button">PLACE</button>

  <a-scene
    vr-mode-ui="enabled: true"
    renderer="colorManagement: true"
    webxr="requiredFeatures: hit-test">

    <a-box
      position="0 0 -1"
      scale="0.2 0.2 0.2"
      color="red">
    </a-box>

    <a-camera></a-camera>

  </a-scene>

    <script>

        const scene = document.querySelector('a-scene');
        const placeButton = document.getElementById('place-button');

        let xrSession = null;
        let hitTestSource = null;

        scene.addEventListener('enter-vr', async () => {

            try {

            xrSession = scene.renderer.xr.getSession();

            alert('1. A-Frame AR session connected');

            const viewerSpace =
                await xrSession.requestReferenceSpace('viewer');

            alert('2. Viewer space created');

            hitTestSource =
                await xrSession.requestHitTestSource({
                space: viewerSpace
                });

            alert('3. Hit-test source created');

            } catch (error) {

            alert('Hit-test error: ' + error.message);

            }

        });

        placeButton.addEventListener('click', () => {

            if (hitTestSource) {
            alert('Hit-test is ready!');
            } else {
            alert('Hit-test is not ready.');
            }

        });

    </script>

</body>
</html>
