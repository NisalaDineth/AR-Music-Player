<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Three.js AR Test</title>

  <link rel="stylesheet" href="./css/style.css">

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }
  </style>
</head>

<body>
  <div id="objectMenu">
    <button id="placeMixerBtn">PLACE MIXER</button>
    <button id="placeLeftBtn">PLACE LEFT MONITOR</button>
    <button id="placeRightBtn">PLACE RIGHT MONITOR</button>
  </div>

  <button id="arExitBtn" aria-label="Stop AR">✕</button>
  
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
    }
  }
  </script>

  <script type="module">

    import * as THREE from
      'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

    import { ARButton } from
      'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/webxr/ARButton.js';

    import { GLTFLoader } from
      'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js';


    /* =========================================================
      BASIC THREE.JS SETUP
      ========================================================= */

    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(
      70,
      window.innerWidth / window.innerHeight,
      0.01,
      20
    );

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: true
    });

    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

    renderer.xr.enabled = true;

    document.body.appendChild(renderer.domElement);


    /* =========================================================
      MIXER MODEL
      ========================================================= */

    const loader = new GLTFLoader();

    let mixerGroup = null;
    let mixerModel = null;

    const MIXER_TILT_X = -40 * (Math.PI / 180);

    loader.load(
      './models/mixer.glb',

      (gltf) => {

        mixerModel = gltf.scene;

        mixerModel.scale.set(
          0.17,
          0.17,
          0.17
        );

        // The tilt lives on the model itself; the Y turn lives on the
        // parent group. Nesting them keeps the two rotations on separate
        // objects so Euler-axis interaction can't bleed into other axes.
        mixerModel.rotation.set(
          MIXER_TILT_X,
          0,
          0
        );

        mixerGroup = new THREE.Group();
        mixerGroup.add(mixerModel);
        mixerGroup.visible = false;

        scene.add(mixerGroup);

        // Basic lighting for the 3D model
        const ambientLight = new THREE.AmbientLight(
          0xffffff,
          2
        );

        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(
          0xffffff,
          2
        );

        directionalLight.position.set(
          2,
          4,
          2
        );

        scene.add(directionalLight);

        alert('Mixer loaded');

      },

      undefined,

      (error) => {

        alert(
          'Mixer loading error:',
          error
        );

      }
    );

    /* =========================================================
      LEFT / RIGHT MONITOR MODELS
      ========================================================= */

    let leftMonitor = null;
    let rightMonitor = null;

    loader.load(
      './models/monitor.glb',

      (gltf) => {

        // Create two independent copies from the same model.
        leftMonitor = gltf.scene;

        rightMonitor = gltf.scene.clone(true);

        // Adjust these later if the monitor is too large/small.
        leftMonitor.scale.set(0.2, 0.2, 0.2);
        rightMonitor.scale.set(0.2, 0.2, 0.2);

        // Hide until we place them in AR.
        leftMonitor.visible = false;
        rightMonitor.visible = false;

        scene.add(leftMonitor);
        scene.add(rightMonitor);

        console.log('Left and right monitors loaded');

      },

      undefined,

      (error) => {
        console.error('Monitor loading error:', error);
      }
    );

    /* =========================================================
      BUTTONS TO PLACE MONITOR MODELS
      ========================================================= */

    let objectToPlace = null;

    document.getElementById('placeMixerBtn').addEventListener('click', () => {
      objectToPlace = mixerModel;
      console.log('Placement mode: MIXER');
    });

    document.getElementById('placeLeftBtn').addEventListener('click', () => {
      objectToPlace = leftMonitor;
      console.log('Placement mode: LEFT MONITOR');
    });

    document.getElementById('placeRightBtn').addEventListener('click', () => {
      objectToPlace = rightMonitor;
      console.log('Placement mode: RIGHT MONITOR');
    });

    /* =========================================================
      PLACEMENT RETICLE
      ========================================================= */

    const reticleGeometry =
      new THREE.RingGeometry(
        0.08,
        0.1,
        32
      );

    const reticleMaterial =
      new THREE.MeshBasicMaterial({
        color: 0x00ff00
      });

    const reticle =
      new THREE.Mesh(
        reticleGeometry,
        reticleMaterial
      );

    reticle.rotation.x = -Math.PI / 2;

    reticle.matrixAutoUpdate = false;
    reticle.visible = false;

    scene.add(reticle);


    /* =========================================================
      WEBXR AR BUTTON
      ========================================================= */

    const arOverlay = document.createElement('div');

    arOverlay.id = 'arOverlay';
    arOverlay.style.position = 'fixed';
    arOverlay.style.inset = '0';
    arOverlay.style.pointerEvents = 'none';
    arOverlay.style.zIndex = '1';

    document.body.appendChild(arOverlay);

    const arButton = ARButton.createButton(renderer, {
      requiredFeatures: ['hit-test'],
      optionalFeatures: ['dom-overlay'],
      domOverlay: { root: arOverlay }
    });

    // Keep the built-in Start/Stop AR button outside the overlay root.
    // It only needs to be visible before the session starts (to enter
    // AR) - nesting it inside the overlay caused it to get left in a
    // broken state after ending a session, since its own "STOP AR" /
    // "START AR" toggle is tied to the overlay root's fullscreen
    // lifecycle. Instead, we use a plain, independent button (below)
    // purely to exit the session while inside AR.
    document.body.appendChild(arButton);

    const arExitBtn = document.getElementById('arExitBtn');

    // Set this inline (not just in CSS) so the button is guaranteed to
    // stay clickable even if the stylesheet hasn't loaded yet, or a
    // stale cached copy without this rule is being served - arOverlay
    // itself has pointer-events:none, so without this the button would
    // silently inherit that and never receive taps.
    arExitBtn.style.pointerEvents = 'auto';

    arExitBtn.addEventListener('click', () => {

      const session = renderer.xr.getSession();

      console.log('Exit button clicked, session:', session);

      if (session) {
        session.end();
      }

    });


    /* =========================================================
      HIT-TEST / DRAG STATE
      ========================================================= */

    let hitTestSource = null;
    let hitTestSourceRequested = false;

    // Screen-tap ("transient") inputs can't be used with the regular
    // requestHitTestSource({space}) call - they need this dedicated API.
    let transientHitTestSource = null;
    let transientHitTestSourceRequested = false;

    // Drag state.
    let dragging = false;
    let activeInputSource = null;   // The input source currently pressed down (selectstart -> selectend).
    let pressStartTime = 0;         // performance.now() timestamp of the current press.
    let justFinishedDrag = false;   // Suppresses tap-to-place right after a drag ends.

    const LONG_PRESS_DURATION_MS = 500;

    const dragRaycaster = new THREE.Raycaster();


    /* =========================================================
      TAP TO PLACE
      ========================================================= */

    function onSelect() {

      // If this tap/release is actually the end of a drag gesture, it's
      // already been handled by the drag logic in the render loop -
      // ignore it here so the mixer doesn't jump back to the reticle.
      if (justFinishedDrag) {
        justFinishedDrag = false;
        return;
      }

      if (!reticle.visible || !mixerModel) {
        return;
      }

      // Only allow the first tap to place the mixer. Once placed, a
      // plain tap does nothing - moving it requires a long press + drag.
      if (mixerGroup.visible) {
        return;
      }

      mixerGroup.position.setFromMatrixPosition(
        reticle.matrix
      );

      // Turn the mixer to face the camera on the horizontal plane.
      // The Y turn lives on the group; the built-in tilt lives on the
      // model itself, so the two rotations can't interact.
      const cameraPos = camera.getWorldPosition(
        new THREE.Vector3()
      );

      const angle = Math.atan2(
        cameraPos.x - mixerGroup.position.x,
        cameraPos.z - mixerGroup.position.z
      );

      mixerGroup.rotation.set(
        0,
        angle,
        0
      );

      mixerGroup.visible = true;

    }


    /* =========================================================
      LONG-PRESS-TO-DRAG HELPERS
      ========================================================= */

    // Builds a world-space ray from an XRInputSource's target ray, so we
    // can test whether it is currently pointing at the mixer model.
    function getInputSourceRay(inputSource, frame, referenceSpace) {

      const pose = frame.getPose(
        inputSource.targetRaySpace,
        referenceSpace
      );

      if (!pose) {
        return null;
      }

      const matrix = new THREE.Matrix4().fromArray(
        pose.transform.matrix
      );

      const origin = new THREE.Vector3().setFromMatrixPosition(matrix);

      const direction = new THREE.Vector3(0, 0, -1)
        .transformDirection(matrix);

      return { origin, direction };

    }


    renderer.xr.addEventListener(
      'sessionend',
      () => {

        console.log('AR SESSION ENDED');

        hitTestSource = null;
        hitTestSourceRequested = false;

        if (transientHitTestSource) {
          transientHitTestSource.cancel();
        }

        transientHitTestSource = null;
        transientHitTestSourceRequested = false;

        dragging = false;
        activeInputSource = null;
        justFinishedDrag = false;

        reticle.visible = false;

        if (mixerGroup) {
          mixerGroup.visible = false;
        }

        // Hide the placement menu again once we leave the AR session.
        const objectMenu = document.getElementById('objectMenu');
        objectMenu.style.display = 'none';
        document.body.appendChild(objectMenu);

        arExitBtn.style.display = 'none';
        document.body.appendChild(arExitBtn);

      }
    );


    /* =========================================================
      TAP EVENTS
      ========================================================= */

    renderer.xr.addEventListener(
      'sessionstart',
      () => {

        const session = renderer.xr.getSession();

        // Reveal the placement menu now that we're inside the AR camera
        // view. It's hidden by default via CSS (display: none) so it
        // doesn't show up on the regular 2D page before AR starts.
        const objectMenu = document.getElementById('objectMenu');
        arOverlay.appendChild(objectMenu);
        objectMenu.style.display = 'flex';
        objectMenu.style.pointerEvents = 'auto';

        arOverlay.appendChild(arExitBtn);
        arExitBtn.style.display = 'block';

        session.addEventListener(
          'selectstart',
          (event) => {

            const inputSource = event.inputSource;

            console.log(
              'SELECT START',
              'targetRayMode:',
              inputSource.targetRayMode,
              'handedness:',
              inputSource.handedness,
              'targetRaySpace:',
              inputSource.targetRaySpace
            );

            // Start tracking this press so the animation loop can detect
            // a long press on the mixer model.
            activeInputSource = inputSource;
            pressStartTime = performance.now();
            dragging = false;

          }
        );

        session.addEventListener(
          'selectend',
          (event) => {

            const inputSource = event.inputSource;

            console.log(
              'SELECT END',
              'targetRayMode:',
              inputSource.targetRayMode,
              'handedness:',
              inputSource.handedness
            );

            // If we were dragging, drop the mixer where it currently is
            // and swallow the upcoming 'select' event so it doesn't
            // re-trigger tap-to-place.
            if (dragging) {
              justFinishedDrag = true;
            }

            dragging = false;
            activeInputSource = null;

          }
        );

        session.addEventListener(
          'select',
          onSelect
        );

      }
    );


    /* =========================================================
      ANIMATION LOOP
      ========================================================= */

    renderer.setAnimationLoop(
      (timestamp, frame) => {

        if (frame) {

          const session =
            renderer.xr.getSession();

          const referenceSpace =
            renderer.xr.getReferenceSpace();

          if (!hitTestSourceRequested) {

            session.requestReferenceSpace(
              'viewer'
            ).then((viewerSpace) => {

              session.requestHitTestSource({
                space: viewerSpace
              }).then((source) => {

                hitTestSource = source;

              });

            });

            hitTestSourceRequested = true;
          }

          if (!transientHitTestSourceRequested) {

            session.requestHitTestSourceForTransientInput({
              profile: 'generic-touchscreen'
            }).then((source) => {

              transientHitTestSource = source;

            }).catch((error) => {

              console.error(
                'Transient hit test subscription failed',
                error
              );

            });

            transientHitTestSourceRequested = true;
          }


          // Placement reticle: only shown before the mixer has been
          // placed. Once placed, relocating it is done via long-press
          // + drag instead of the look-and-tap reticle.
          if (hitTestSource && (!mixerGroup || !mixerGroup.visible)) {

            const hitTestResults =
              frame.getHitTestResults(
                hitTestSource
              );

            if (hitTestResults.length > 0) {

              const hit =
                hitTestResults[0];

              const pose =
                hit.getPose(referenceSpace);

              reticle.visible = true;

              reticle.matrix.fromArray(
                pose.transform.matrix
              );

            } else {

              reticle.visible = false;

            }

          } else {

            reticle.visible = false;

          }


          // Long-press detection: while a finger/controller is held down
          // on top of the already-placed mixer for longer than
          // LONG_PRESS_DURATION_MS, enter drag mode.
          if (
            activeInputSource &&
            !dragging &&
            mixerGroup &&
            mixerGroup.visible
          ) {

            const elapsed =
              performance.now() - pressStartTime;

            if (elapsed >= LONG_PRESS_DURATION_MS) {

              const ray = getInputSourceRay(
                activeInputSource,
                frame,
                referenceSpace
              );

              if (ray) {

                dragRaycaster.set(
                  ray.origin,
                  ray.direction
                );

                const intersections =
                  dragRaycaster.intersectObject(
                    mixerModel,
                    true
                  );

                if (intersections.length > 0) {

                  dragging = true;

                }

              }

            }

          }


          // While dragging, move the mixer to follow the surface point
          // under the finger/controller each frame.
          if (
            dragging &&
            transientHitTestSource &&
            activeInputSource
          ) {

            const transientResults =
              frame.getHitTestResultsForTransientInput(
                transientHitTestSource
              );

            const match = transientResults.find(
              (result) => result.inputSource === activeInputSource
            );

            if (match && match.results.length > 0) {

              const hit =
                match.results[0];

              const pose =
                hit.getPose(referenceSpace);

              mixerGroup.position.set(
                pose.transform.position.x,
                pose.transform.position.y,
                pose.transform.position.z
              );

              // Turn the mixer to face the camera on the horizontal
              // plane. The Y turn lives on the group; the built-in tilt
              // lives on the model, so they can't interact.
              const cameraPos = camera.getWorldPosition(
                new THREE.Vector3()
              );

              const angle = Math.atan2(
                cameraPos.x - mixerGroup.position.x,
                cameraPos.z - mixerGroup.position.z
              );

              mixerGroup.rotation.set(
                0,
                angle,
                0
              );

            }

          }

        }

        renderer.render(
          scene,
          camera
        );

      }
    );


    /* =========================================================
      WINDOW RESIZE
      ========================================================= */

    window.addEventListener(
      'resize',
      () => {

        // Do not change renderer size
        // while an immersive AR session is active.
        if (renderer.xr.isPresenting) {
          return;
        }

        camera.aspect =
          window.innerWidth /
          window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
          window.innerWidth,
          window.innerHeight
        );

      }
    );

  </script>

</body>
</html>
