<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Three.js AR Test</title>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }
  </style>
</head>

<body>
  
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
    }
  }
  </script>

  <script type="module">

    import * as THREE from
      'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

    import { ARButton } from
      'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/webxr/ARButton.js';

    import { GLTFLoader } from
      'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js';


    /* =========================================================
      BASIC THREE.JS SETUP
      ========================================================= */

    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(
      70,
      window.innerWidth / window.innerHeight,
      0.01,
      20
    );

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: true
    });

    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

    renderer.xr.enabled = true;

    document.body.appendChild(renderer.domElement);


    /* =========================================================
      MIXER MODEL
      ========================================================= */

    const loader = new GLTFLoader();

    let mixerModel = null;

    loader.load(
      './models/mixer.glb',

      (gltf) => {

        mixerModel = gltf.scene;

        mixerModel.scale.set(
          0.2,
          0.2,
          0.2
        );
        
        mixerModel.rotation.set(
          45,
          Math.PI,
          0
        );

        mixerModel.visible = false;

        scene.add(mixerModel);

        // Basic lighting for the 3D model
        const ambientLight = new THREE.AmbientLight(
          0xffffff,
          2
        );

        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(
          0xffffff,
          2
        );

        directionalLight.position.set(
          2,
          4,
          2
        );

        scene.add(directionalLight);

        alert('Mixer loaded');

      },

      undefined,

      (error) => {

        alert(
          'Mixer loading error:',
          error
        );

      }
    );


    /* =========================================================
      PLACEMENT RETICLE
      ========================================================= */

    const reticleGeometry =
      new THREE.RingGeometry(
        0.08,
        0.1,
        32
      );

    const reticleMaterial =
      new THREE.MeshBasicMaterial({
        color: 0x00ff00
      });

    const reticle =
      new THREE.Mesh(
        reticleGeometry,
        reticleMaterial
      );

    reticle.rotation.x = -Math.PI / 2;

    reticle.matrixAutoUpdate = false;
    reticle.visible = false;

    scene.add(reticle);


    /* =========================================================
      WEBXR AR BUTTON
      ========================================================= */

    const arButton =
      ARButton.createButton(
        renderer,
        {
          requiredFeatures: ['hit-test']
        }
      );

    document.body.appendChild(arButton);


    /* =========================================================
      HIT-TEST / DRAG STATE
      ========================================================= */

    let hitTestSource = null;
    let hitTestSourceRequested = false;

    // Screen-tap ("transient") inputs can't be used with the regular
    // requestHitTestSource({space}) call - they need this dedicated API.
    let transientHitTestSource = null;
    let transientHitTestSourceRequested = false;

    // Drag state.
    let dragging = false;
    let activeInputSource = null;   // The input source currently pressed down (selectstart -> selectend).
    let pressStartTime = 0;         // performance.now() timestamp of the current press.
    let justFinishedDrag = false;   // Suppresses tap-to-place right after a drag ends.

    const LONG_PRESS_DURATION_MS = 500;

    const dragRaycaster = new THREE.Raycaster();


    /* =========================================================
      TAP TO PLACE
      ========================================================= */

    function onSelect() {

      // If this tap/release is actually the end of a drag gesture, it's
      // already been handled by the drag logic in the render loop -
      // ignore it here so the mixer doesn't jump back to the reticle.
      if (justFinishedDrag) {
        justFinishedDrag = false;
        return;
      }

      if (!reticle.visible || !mixerModel) {
        return;
      }

      // Only allow the first tap to place the mixer. Once placed, a
      // plain tap does nothing - moving it requires a long press + drag.
      if (mixerModel.visible) {
        return;
      }

      mixerModel.position.setFromMatrixPosition(
        reticle.matrix
      );

      mixerModel.visible = true;

    }


    /* =========================================================
      LONG-PRESS-TO-DRAG HELPERS
      ========================================================= */

    // Builds a world-space ray from an XRInputSource's target ray, so we
    // can test whether it is currently pointing at the mixer model.
    function getInputSourceRay(inputSource, frame, referenceSpace) {

      const pose = frame.getPose(
        inputSource.targetRaySpace,
        referenceSpace
      );

      if (!pose) {
        return null;
      }

      const matrix = new THREE.Matrix4().fromArray(
        pose.transform.matrix
      );

      const origin = new THREE.Vector3().setFromMatrixPosition(matrix);

      const direction = new THREE.Vector3(0, 0, -1)
        .transformDirection(matrix);

      return { origin, direction };

    }


    renderer.xr.addEventListener(
      'sessionend',
      () => {

        hitTestSource = null;
        hitTestSourceRequested = false;

        if (transientHitTestSource) {
          transientHitTestSource.cancel();
        }

        transientHitTestSource = null;
        transientHitTestSourceRequested = false;

        dragging = false;
        activeInputSource = null;
        justFinishedDrag = false;

        reticle.visible = false;

        if (mixerModel) {
          mixerModel.visible = false;
        }

      }
    );


    /* =========================================================
      TAP EVENTS
      ========================================================= */

    renderer.xr.addEventListener(
      'sessionstart',
      () => {

        const session = renderer.xr.getSession();

        session.addEventListener(
          'selectstart',
          (event) => {

            const inputSource = event.inputSource;

            console.log(
              'SELECT START',
              'targetRayMode:',
              inputSource.targetRayMode,
              'handedness:',
              inputSource.handedness,
              'targetRaySpace:',
              inputSource.targetRaySpace
            );

            // Start tracking this press so the animation loop can detect
            // a long press on the mixer model.
            activeInputSource = inputSource;
            pressStartTime = performance.now();
            dragging = false;

          }
        );

        session.addEventListener(
          'selectend',
          (event) => {

            const inputSource = event.inputSource;

            console.log(
              'SELECT END',
              'targetRayMode:',
              inputSource.targetRayMode,
              'handedness:',
              inputSource.handedness
            );

            // If we were dragging, drop the mixer where it currently is
            // and swallow the upcoming 'select' event so it doesn't
            // re-trigger tap-to-place.
            if (dragging) {
              justFinishedDrag = true;
            }

            dragging = false;
            activeInputSource = null;

          }
        );

        session.addEventListener(
          'select',
          onSelect
        );

      }
    );


    /* =========================================================
      ANIMATION LOOP
      ========================================================= */

    renderer.setAnimationLoop(
      (timestamp, frame) => {

        if (frame) {

          const session =
            renderer.xr.getSession();

          const referenceSpace =
            renderer.xr.getReferenceSpace();

          if (!hitTestSourceRequested) {

            session.requestReferenceSpace(
              'viewer'
            ).then((viewerSpace) => {

              session.requestHitTestSource({
                space: viewerSpace
              }).then((source) => {

                hitTestSource = source;

              });

            });

            hitTestSourceRequested = true;
          }

          if (!transientHitTestSourceRequested) {

            session.requestHitTestSourceForTransientInput({
              profile: 'generic-touchscreen'
            }).then((source) => {

              transientHitTestSource = source;

            }).catch((error) => {

              console.error(
                'Transient hit test subscription failed',
                error
              );

            });

            transientHitTestSourceRequested = true;
          }


          // Placement reticle: only shown before the mixer has been
          // placed. Once placed, relocating it is done via long-press
          // + drag instead of the look-and-tap reticle.
          if (hitTestSource && (!mixerModel || !mixerModel.visible)) {

            const hitTestResults =
              frame.getHitTestResults(
                hitTestSource
              );

            if (hitTestResults.length > 0) {

              const hit =
                hitTestResults[0];

              const pose =
                hit.getPose(referenceSpace);

              reticle.visible = true;

              reticle.matrix.fromArray(
                pose.transform.matrix
              );

            } else {

              reticle.visible = false;

            }

          } else {

            reticle.visible = false;

          }


          // Long-press detection: while a finger/controller is held down
          // on top of the already-placed mixer for longer than
          // LONG_PRESS_DURATION_MS, enter drag mode.
          if (
            activeInputSource &&
            !dragging &&
            mixerModel &&
            mixerModel.visible
          ) {

            const elapsed =
              performance.now() - pressStartTime;

            if (elapsed >= LONG_PRESS_DURATION_MS) {

              const ray = getInputSourceRay(
                activeInputSource,
                frame,
                referenceSpace
              );

              if (ray) {

                dragRaycaster.set(
                  ray.origin,
                  ray.direction
                );

                const intersections =
                  dragRaycaster.intersectObject(
                    mixerModel,
                    true
                  );

                if (intersections.length > 0) {

                  dragging = true;

                }

              }

            }

          }


          // While dragging, move the mixer to follow the surface point
          // under the finger/controller each frame.
          if (
            dragging &&
            transientHitTestSource &&
            activeInputSource
          ) {

            const transientResults =
              frame.getHitTestResultsForTransientInput(
                transientHitTestSource
              );

            const match = transientResults.find(
              (result) => result.inputSource === activeInputSource
            );

            if (match && match.results.length > 0) {

              const hit =
                match.results[0];

              const pose =
                hit.getPose(referenceSpace);

              mixerModel.position.set(
                pose.transform.position.x,
                pose.transform.position.y,
                pose.transform.position.z
              );

            }

          }

        }

        renderer.render(
          scene,
          camera
        );

      }
    );


    /* =========================================================
      WINDOW RESIZE
      ========================================================= */

    window.addEventListener(
      'resize',
      () => {

        // Do not change renderer size
        // while an immersive AR session is active.
        if (renderer.xr.isPresenting) {
          return;
        }

        camera.aspect =
          window.innerWidth /
          window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
          window.innerWidth,
          window.innerHeight
        );

      }
    );

  </script>

</body>
</html>
