<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Three.js AR Test</title>

  <link rel="stylesheet" href="./css/style.css">

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }

    #playBtn {
      position: fixed;
      left: 50%;
      bottom: 30px;
      transform: translateX(-50%);
      z-index: 10000;

      padding: 14px 28px;
      border: none;
      border-radius: 10px;

      background: rgba(255, 255, 255, 0.95);
      color: #222;

      font-size: 16px;
      font-weight: bold;
      font-family: Arial, sans-serif;

      display: none;
      pointer-events: auto;
    }
  </style>
</head>

<body>
  <div id="objectMenu">
    <button id="placeMixerBtn">PLACE MIXER</button>
    <button id="placeLeftBtn">PLACE LEFT MONITOR</button>
    <button id="placeRightBtn">PLACE RIGHT MONITOR</button>
  </div>

  <button id="playBtn">PLAY SPATIAL AUDIO</button>

  <button id="arExitBtn" aria-label="Stop AR">✕</button>
  
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
    }
  }
  </script>

  <script type="module">

    import * as THREE from
      'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

    import { ARButton } from
      'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/webxr/ARButton.js';

    import { GLTFLoader } from
      'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js';


    /* =========================================================
      BASIC THREE.JS SETUP
      ========================================================= */

    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(
      70,
      window.innerWidth / window.innerHeight,
      0.01,
      20
    );

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: true
    });

    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

    renderer.xr.enabled = true;

    document.body.appendChild(renderer.domElement);

    // Shared lighting - added once, illuminates every model.
    const ambientLight = new THREE.AmbientLight(0xffffff, 2);
    scene.add(ambientLight);

    const directionalLight = new THREE.DirectionalLight(0xffffff, 2);
    directionalLight.position.set(2, 4, 2);
    scene.add(directionalLight);


    /* =========================================================
      PLACEABLE-OBJECT REGISTRY
      ========================================================= */

    // Every placeable object is a Group (handles position + Y turn)
    // wrapping the loaded model (handles scale + any built-in tilt).
    // This keeps the two rotations on separate objects so Euler-axis
    // interaction can't bleed into other axes - the same fix that was
    // applied to the mixer.
    const placeables = [];

    let selectedPlaceable = null;  // chosen via menu button; receives the next tap-to-place
    let draggingObject = null;     // the placeable currently being dragged


    /* =========================================================
      MODELS
      ========================================================= */

    const loader = new GLTFLoader();

    const MIXER_TILT_X = -40 * (Math.PI / 180);
    const MONITOR_SCALE = 0.2;
    const MONITOR_FILL_INTENSITY = 10;

    /* ---- Mixer ---- */

    let mixerGroup = null;
    let mixerModel = null;

    loader.load(
      './models/mixer.glb',

      (gltf) => {

        mixerModel = gltf.scene;

        mixerModel.scale.set(0.17, 0.17, 0.17);

        mixerModel.rotation.set(MIXER_TILT_X, 0, 0);

        mixerGroup = new THREE.Group();
        mixerGroup.add(mixerModel);
        mixerGroup.visible = false;

        scene.add(mixerGroup);

        placeables.push(mixerGroup);

        alert('Mixer loaded');

      },

      undefined,

      (error) => {
        alert('Mixer loading error:', error);
      }
    );

    /* ---- Left / Right Monitors ---- */

    let leftMonitorGroup = null;
    let rightMonitorGroup = null;

    function addMonitorFillLight(group, position) {

      const fillLight = new THREE.PointLight(
        0xffffff,
        MONITOR_FILL_INTENSITY,
        10
      );

      fillLight.position.copy(position);
      group.add(fillLight);

    }

    loader.load(
      './models/monitor.glb',

      (gltf) => {

        const leftModel = gltf.scene;
        const rightModel = gltf.scene.clone(true);

        leftModel.scale.set(MONITOR_SCALE, MONITOR_SCALE, MONITOR_SCALE);
        rightModel.scale.set(MONITOR_SCALE, MONITOR_SCALE, MONITOR_SCALE);

        leftModel.rotation.set(0, 0, 0);
        rightModel.rotation.set(0, 0, 0);

        leftMonitorGroup = new THREE.Group();
        leftMonitorGroup.add(leftModel);
        addMonitorFillLight(leftMonitorGroup, new THREE.Vector3(0, 0, 1.5));
        addMonitorFillLight(leftMonitorGroup, new THREE.Vector3(-1, -0.5, 0));
        addMonitorFillLight(leftMonitorGroup, new THREE.Vector3(0, -0.5, -1.5));
        leftMonitorGroup.visible = false;
        scene.add(leftMonitorGroup);
        placeables.push(leftMonitorGroup);

        rightMonitorGroup = new THREE.Group();
        rightMonitorGroup.add(rightModel);
        addMonitorFillLight(rightMonitorGroup, new THREE.Vector3(0, 0, 1.5));
        addMonitorFillLight(rightMonitorGroup, new THREE.Vector3(-1, -0.5, 0));
        addMonitorFillLight(rightMonitorGroup, new THREE.Vector3(0, -0.5, -1.5));
        rightMonitorGroup.visible = false;
        scene.add(rightMonitorGroup);
        placeables.push(rightMonitorGroup);

        console.log('Left and right monitors loaded');

      },

      undefined,

      (error) => {
        console.error('Monitor loading error:', error);
      }
    );


    /* =========================================================
      MENU BUTTONS - SELECT WHICH OBJECT TO PLACE
      ========================================================= */

    document.getElementById('placeMixerBtn').addEventListener('click', () => {
      selectedPlaceable = mixerGroup;
      console.log('Placement mode: MIXER');
    });

    document.getElementById('placeLeftBtn').addEventListener('click', () => {
      selectedPlaceable = leftMonitorGroup;
      console.log('Placement mode: LEFT MONITOR');
    });

    document.getElementById('placeRightBtn').addEventListener('click', () => {
      selectedPlaceable = rightMonitorGroup;
      console.log('Placement mode: RIGHT MONITOR');
    });


    /* =========================================================
      PLACEMENT RETICLE
      ========================================================= */

    const reticleGeometry =
      new THREE.RingGeometry(0.08, 0.1, 32);

    const reticleMaterial =
      new THREE.MeshBasicMaterial({ color: 0x00ff00 });

    const reticle =
      new THREE.Mesh(reticleGeometry, reticleMaterial);

    reticle.rotation.x = -Math.PI / 2;

    reticle.matrixAutoUpdate = false;
    reticle.visible = false;

    scene.add(reticle);


    /* =========================================================
      WEBXR AR BUTTON
      ========================================================= */

    const arOverlay = document.createElement('div');

    arOverlay.id = 'arOverlay';
    arOverlay.style.position = 'fixed';
    arOverlay.style.inset = '0';
    arOverlay.style.pointerEvents = 'none';
    arOverlay.style.zIndex = '1';

    document.body.appendChild(arOverlay);

    const arButton = ARButton.createButton(renderer, {
      requiredFeatures: ['hit-test'],
      optionalFeatures: ['dom-overlay'],
      domOverlay: { root: arOverlay }
    });

    document.body.appendChild(arButton);

    const arExitBtn = document.getElementById('arExitBtn');

    arExitBtn.style.pointerEvents = 'auto';

    arExitBtn.addEventListener('click', () => {

      const session = renderer.xr.getSession();

      console.log('Exit button clicked, session:', session);

      if (session) {
        session.end();
      }

    });


    /* =========================================================
      SPATIAL AUDIO
      ========================================================= */

    let audioContext = null;
    let audioElement = null;
    let sourceNode = null;

    let splitterNode = null;

    let leftPannerNode = null;
    let rightPannerNode = null;

    let leftDelayNode = null;
    let rightDelayNode = null;

    const SPEED_OF_SOUND_METERS_PER_SECOND = 343;
    const MAX_SOURCE_DELAY_SECONDS = 1;

    function createSpatialAudio() {

      audioContext = new AudioContext();

      audioElement = new Audio('./audio/song1.mp3');
      audioElement.loop = true;

      sourceNode =
        audioContext.createMediaElementSource(audioElement);

      // Split stereo so the left channel feeds the left monitor
      // panner and the right channel feeds the right monitor panner.
      splitterNode = audioContext.createChannelSplitter(2);

      sourceNode.connect(splitterNode);

      leftDelayNode = audioContext.createDelay(1.0);
      rightDelayNode = audioContext.createDelay(1.0);

      // HRTF panners — one per monitor.
      leftPannerNode = audioContext.createPanner();
      leftPannerNode.panningModel = 'HRTF';
      leftPannerNode.distanceModel = 'inverse';
      leftPannerNode.refDistance = 1;
      leftPannerNode.maxDistance = 10;
      leftPannerNode.rolloffFactor = 1;
      leftPannerNode.coneInnerAngle = 60;
      leftPannerNode.coneOuterAngle = 180;
      leftPannerNode.coneOuterGain = 0.3;

      rightPannerNode = audioContext.createPanner();
      rightPannerNode.panningModel = 'HRTF';
      rightPannerNode.distanceModel = 'inverse';
      rightPannerNode.refDistance = 1;
      rightPannerNode.maxDistance = 10;
      rightPannerNode.rolloffFactor = 1;
      rightPannerNode.coneInnerAngle = 60;
      rightPannerNode.coneOuterAngle = 180;
      rightPannerNode.coneOuterGain = 0.3;

      // Left channel → left delay → left panner → listener
      splitterNode.connect(leftDelayNode, 0);
      leftDelayNode.connect(leftPannerNode);
      leftPannerNode.connect(audioContext.destination);

      // Right channel → right delay → right panner → listener
      splitterNode.connect(rightDelayNode, 1);
      rightDelayNode.connect(rightPannerNode);
      rightPannerNode.connect(audioContext.destination);

      updatePannerPosition();

      console.log('Two-speaker spatial audio created');
    }

    // Updates each panner's position + orientation from the
    // corresponding monitor group, and sets a distance-based delay
    // so sound from a farther monitor arrives slightly later.
    function updatePannerPosition() {

      if (
        !leftPannerNode ||
        !rightPannerNode ||
        !leftMonitorGroup ||
        !rightMonitorGroup
      ) {
        return;
      }

      const listenerPosition =
        camera.getWorldPosition(new THREE.Vector3());

      // ---- Left monitor ----

      const leftPosition =
        leftMonitorGroup.getWorldPosition(new THREE.Vector3());

      leftPannerNode.positionX.value = leftPosition.x;
      leftPannerNode.positionY.value = leftPosition.y;
      leftPannerNode.positionZ.value = leftPosition.z;

      const leftQuaternion =
        leftMonitorGroup.getWorldQuaternion(new THREE.Quaternion());

      const leftForward = new THREE.Vector3(0, 0, -1);
      leftForward.applyQuaternion(leftQuaternion);

      leftPannerNode.orientationX.value = leftForward.x;
      leftPannerNode.orientationY.value = leftForward.y;
      leftPannerNode.orientationZ.value = leftForward.z;

      if (leftDelayNode && leftMonitorGroup.visible) {
        const leftDistance =
          listenerPosition.distanceTo(leftPosition);
        const leftDelay = Math.min(
          leftDistance / SPEED_OF_SOUND_METERS_PER_SECOND,
          MAX_SOURCE_DELAY_SECONDS
        );

        leftDelayNode.delayTime.setTargetAtTime(
          leftDelay,
          audioContext.currentTime,
          0.05
        );
      }

      // ---- Right monitor ----

      const rightPosition =
        rightMonitorGroup.getWorldPosition(new THREE.Vector3());

      rightPannerNode.positionX.value = rightPosition.x;
      rightPannerNode.positionY.value = rightPosition.y;
      rightPannerNode.positionZ.value = rightPosition.z;

      const rightQuaternion =
        rightMonitorGroup.getWorldQuaternion(new THREE.Quaternion());

      const rightForward = new THREE.Vector3(0, 0, -1);
      rightForward.applyQuaternion(rightQuaternion);

      rightPannerNode.orientationX.value = rightForward.x;
      rightPannerNode.orientationY.value = rightForward.y;
      rightPannerNode.orientationZ.value = rightForward.z;

      if (rightDelayNode && rightMonitorGroup.visible) {
        const rightDistance =
          listenerPosition.distanceTo(rightPosition);
        const rightDelay = Math.min(
          rightDistance / SPEED_OF_SOUND_METERS_PER_SECOND,
          MAX_SOURCE_DELAY_SECONDS
        );

        rightDelayNode.delayTime.setTargetAtTime(
          rightDelay,
          audioContext.currentTime,
          0.05
        );
      }
    }

    // Syncs the AudioListener to the camera so spatialization
    // reflects where the user is actually standing and looking.
    function updateAudioListener() {

      if (!audioContext) return;

      const listener = audioContext.listener;

      const cameraPosition =
        camera.getWorldPosition(new THREE.Vector3());

      const cameraQuaternion =
        camera.getWorldQuaternion(new THREE.Quaternion());

      const forward = new THREE.Vector3(0, 0, -1);
      forward.applyQuaternion(cameraQuaternion);

      const up = new THREE.Vector3(0, 1, 0);
      up.applyQuaternion(cameraQuaternion);

      listener.positionX.value = cameraPosition.x;
      listener.positionY.value = cameraPosition.y;
      listener.positionZ.value = cameraPosition.z;

      listener.forwardX.value = forward.x;
      listener.forwardY.value = forward.y;
      listener.forwardZ.value = forward.z;

      listener.upX.value = up.x;
      listener.upY.value = up.y;
      listener.upZ.value = up.z;
    }


    /* =========================================================
      PLAY BUTTON
      ========================================================= */

    const playBtn = document.getElementById('playBtn');

    playBtn.addEventListener('click', async () => {

      try {

        if (!audioContext) {
          createSpatialAudio();
        }

        if (audioContext.state === 'suspended') {
          await audioContext.resume();
        }

        await audioElement.play();

        playBtn.textContent = 'SPATIAL AUDIO PLAYING';

      } catch (error) {

        console.error('Audio error:', error);
        alert('Could not start audio: ' + error.message);

      }

    });


    /* =========================================================
      HIT-TEST / DRAG STATE
      ========================================================= */

    let hitTestSource = null;
    let hitTestSourceRequested = false;

    let transientHitTestSource = null;
    let transientHitTestSourceRequested = false;

    let activeInputSource = null;
    let pressStartTime = 0;
    let justFinishedDrag = false;

    const LONG_PRESS_DURATION_MS = 500;

    const dragRaycaster = new THREE.Raycaster();


    /* =========================================================
      TAP TO PLACE
      ========================================================= */

    function onSelect() {

      // If this tap/release is actually the end of a drag gesture, it's
      // already been handled by the drag logic in the render loop -
      // ignore it here so the object doesn't jump back to the reticle.
      if (justFinishedDrag) {
        justFinishedDrag = false;
        return;
      }

      if (!reticle.visible || !selectedPlaceable) {
        return;
      }

      // Only allow the first tap to place the selected object. Once
      // placed, moving it requires a long press + drag.
      if (selectedPlaceable.visible) {
        return;
      }

      placeAtReticle(selectedPlaceable);

    }

    // Places a placeable group at the reticle position and turns it to
    // face the camera. The Y turn lives on the group; any built-in
    // tilt lives on the child model, so the two rotations can't
    // interact.
    function placeAtReticle(group) {

      group.position.setFromMatrixPosition(reticle.matrix);

      faceCamera(group);

      group.visible = true;

    }

    // Rotates a group to face the camera on the horizontal plane.
    function faceCamera(group) {

      const cameraPos = camera.getWorldPosition(new THREE.Vector3());

      const angle = Math.atan2(
        cameraPos.x - group.position.x,
        cameraPos.z - group.position.z
      );

      group.rotation.set(0, angle, 0);

    }


    /* =========================================================
      LONG-PRESS-TO-DRAG HELPERS
      ========================================================= */

    function getInputSourceRay(inputSource, frame, referenceSpace) {

      const pose = frame.getPose(
        inputSource.targetRaySpace,
        referenceSpace
      );

      if (!pose) {
        return null;
      }

      const matrix = new THREE.Matrix4().fromArray(
        pose.transform.matrix
      );

      const origin = new THREE.Vector3().setFromMatrixPosition(matrix);

      const direction = new THREE.Vector3(0, 0, -1)
        .transformDirection(matrix);

      return { origin, direction };

    }


    renderer.xr.addEventListener(
      'sessionend',
      () => {

        console.log('AR SESSION ENDED');

        hitTestSource = null;
        hitTestSourceRequested = false;

        if (transientHitTestSource) {
          transientHitTestSource.cancel();
        }

        transientHitTestSource = null;
        transientHitTestSourceRequested = false;

        activeInputSource = null;
        justFinishedDrag = false;
        draggingObject = null;
        selectedPlaceable = null;

        reticle.visible = false;

        placeables.forEach((group) => {
          group.visible = false;
        });

        // Stop audio and reset play button.
        if (audioElement) {
          audioElement.pause();
          audioElement.currentTime = 0;
        }

        if (audioContext && audioContext.state !== 'closed') {
          audioContext.suspend();
        }

        playBtn.textContent = 'PLAY SPATIAL AUDIO';

        const objectMenu = document.getElementById('objectMenu');
        objectMenu.style.display = 'none';
        document.body.appendChild(objectMenu);

        arExitBtn.style.display = 'none';
        document.body.appendChild(arExitBtn);

        document.body.appendChild(playBtn);
        playBtn.style.display = 'none';

      }
    );


    /* =========================================================
      TAP EVENTS
      ========================================================= */

    renderer.xr.addEventListener(
      'sessionstart',
      () => {

        const session = renderer.xr.getSession();

        const objectMenu = document.getElementById('objectMenu');
        arOverlay.appendChild(objectMenu);
        objectMenu.style.display = 'flex';
        objectMenu.style.pointerEvents = 'auto';

        arOverlay.appendChild(arExitBtn);
        arExitBtn.style.display = 'block';

        arOverlay.appendChild(playBtn);
        playBtn.style.display = 'block';

        session.addEventListener(
          'selectstart',
          (event) => {

            const inputSource = event.inputSource;

            activeInputSource = inputSource;
            pressStartTime = performance.now();
            draggingObject = null;

          }
        );

        session.addEventListener(
          'selectend',
          () => {

            if (draggingObject) {
              justFinishedDrag = true;
            }

            draggingObject = null;
            activeInputSource = null;

          }
        );

        session.addEventListener(
          'select',
          onSelect
        );

      }
    );


    /* =========================================================
      ANIMATION LOOP
      ========================================================= */

    renderer.setAnimationLoop(
      (timestamp, frame) => {

        if (frame) {

          const session = renderer.xr.getSession();

          const referenceSpace = renderer.xr.getReferenceSpace();

          if (!hitTestSourceRequested) {

            session.requestReferenceSpace('viewer').then((viewerSpace) => {

              session.requestHitTestSource({
                space: viewerSpace
              }).then((source) => {
                hitTestSource = source;
              });

            });

            hitTestSourceRequested = true;
          }

          if (!transientHitTestSourceRequested) {

            session.requestHitTestSourceForTransientInput({
              profile: 'generic-touchscreen'
            }).then((source) => {
              transientHitTestSource = source;
            }).catch((error) => {
              console.error(
                'Transient hit test subscription failed',
                error
              );
            });

            transientHitTestSourceRequested = true;
          }


          // Placement reticle: shown when a selected object hasn't
          // been placed yet. Once placed, relocating it is done via
          // long-press + drag instead of the look-and-tap reticle.
          const showReticle =
            hitTestSource &&
            selectedPlaceable &&
            !selectedPlaceable.visible;

          if (showReticle) {

            const hitTestResults =
              frame.getHitTestResults(hitTestSource);

            if (hitTestResults.length > 0) {

              const hit = hitTestResults[0];

              const pose = hit.getPose(referenceSpace);

              reticle.visible = true;

              reticle.matrix.fromArray(
                pose.transform.matrix
              );

            } else {

              reticle.visible = false;

            }

          } else {

            reticle.visible = false;

          }


          // Long-press detection: while a finger/controller is held
          // down on top of an already-placed object for longer than
          // LONG_PRESS_DURATION_MS, enter drag mode.
          if (
            activeInputSource &&
            !draggingObject
          ) {

            const elapsed = performance.now() - pressStartTime;

            if (elapsed >= LONG_PRESS_DURATION_MS) {

              const ray = getInputSourceRay(
                activeInputSource,
                frame,
                referenceSpace
              );

              if (ray) {

                dragRaycaster.set(ray.origin, ray.direction);

                // Test against every visible placeable; the first hit
                // becomes the drag target.
                for (const group of placeables) {

                  if (!group.visible) continue;

                  const intersections =
                    dragRaycaster.intersectObject(group, true);

                  if (intersections.length > 0) {

                    draggingObject = group;
                    break;

                  }

                }

              }

            }

          }


          // While dragging, move the object to follow the surface
          // point under the finger/controller each frame.
          if (
            draggingObject &&
            transientHitTestSource &&
            activeInputSource
          ) {

            const transientResults =
              frame.getHitTestResultsForTransientInput(
                transientHitTestSource
              );

            const match = transientResults.find(
              (result) => result.inputSource === activeInputSource
            );

            if (match && match.results.length > 0) {

              const hit = match.results[0];

              const pose = hit.getPose(referenceSpace);

              draggingObject.position.set(
                pose.transform.position.x,
                pose.transform.position.y,
                pose.transform.position.z
              );

              faceCamera(draggingObject);

            }

          }

        }

        // Update spatial audio every frame so panner positions and
        // the listener track the monitors and camera in real time.
        updatePannerPosition();

        updateAudioListener();

        renderer.render(scene, camera);

      }
    );


    /* =========================================================
      WINDOW RESIZE
      ========================================================= */

    window.addEventListener(
      'resize',
      () => {

        if (renderer.xr.isPresenting) {
          return;
        }

        camera.aspect =
          window.innerWidth / window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
          window.innerWidth,
          window.innerHeight
        );

      }
    );

  </script>

</body>
</html>
